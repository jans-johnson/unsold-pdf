name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (web + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: mkdir -p native/www && cargo test --manifest-path native/Cargo.toml

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
            binary: native/target/aarch64-apple-darwin/release/unacrobat
          - name: macOS x64
            os: macos-13
            args: --target x86_64-apple-darwin
            binary: native/target/x86_64-apple-darwin/release/unacrobat
          - name: Windows x64
            os: windows-latest
            args: ''
            binary: native/target/release/unacrobat.exe
          - name: Linux x64
            os: ubuntu-22.04
            args: ''
            binary: native/target/release/unacrobat
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'apple-darwin') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - name: Self-test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ${{ matrix.binary }} --self-test
      - name: Self-test
        if: runner.os != 'Linux'
        shell: bash
        run: ${{ matrix.binary }} --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: unacrobat-${{ matrix.name }}
          path: |
            native/target/**/release/bundle/dmg/*.dmg
            native/target/**/release/bundle/msi/*.msi
            native/target/**/release/bundle/nsis/*.exe
            native/target/**/release/bundle/appimage/*.AppImage
            native/target/**/release/bundle/deb/*.deb
            native/target/**/release/bundle/rpm/*.rpm
          if-no-files-found: warn

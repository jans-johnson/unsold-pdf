<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <meta
      name="description"
      content="Generate a table of contents page from PDF bookmarks. Free, no uploads, no signup. Runs entirely in your browser."
    />
    <meta name="keywords" content="table of contents, online pdf" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical URL -->

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Generate a table of contents page from PDF bookmarks. Free, no uploads, no signup. Runs entirely in your browser."
    />

    <!-- Twitter Card -->

    <!-- Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Table Of Contents" />

    <title>Generate Table of Contents - UnAcrobat</title>

    <link href="/src/css/styles.css" rel="stylesheet" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/favicon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/favicon-512x512.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
  </head>

  <body class="antialiased bg-gray-900">
    {{> navbar }}

    <div
      id="uploader"
      class="min-h-screen flex items-center justify-center p-4 bg-gray-900"
    >
      <div
        id="tool-uploader"
        class="bg-gray-800 rounded-xl shadow-xl p-8 max-w-2xl w-full text-gray-200 border border-gray-700"
      >
        <button
          id="back-to-tools"
          class="flex items-center gap-2 text-indigo-300 hover:text-indigo-400 mb-6 font-semibold"
        >
          <i data-lucide="arrow-left" class="cursor-pointer"></i>
          <span class="cursor-pointer" data-i18n="tools.backToTools">
            Back to Tools
          </span>
        </button>
        <h1
          class="text-2xl font-bold text-white mb-2"
          data-i18n="tools:tableOfContents.name"
        >
          Table of Contents
        </h1>
        <p
          class="text-gray-400 mb-6"
          data-i18n="tools:tableOfContents.subtitle"
        >
          Generate a table of contents page from PDF bookmarks.
        </p>

        <!-- Drop Zone for Main PDF Upload -->
        <div
          id="drop-zone"
          class="relative flex flex-col items-center justify-center w-full h-48 border-2 border-dashed border-gray-600 rounded-xl cursor-pointer bg-gray-700 hover:bg-gray-600 transition-colors duration-300"
        >
          <div class="flex flex-col items-center justify-center pt-5 pb-6">
            <i class="ph ph-upload-simple text-4xl mb-3 text-gray-400"></i>
            <p class="mb-2 text-sm text-gray-300">
              <span class="font-semibold" data-i18n="upload.clickToSelect"
                >Click to select a file</span
              >
              <span data-i18n="upload.orDragAndDrop">or drag and drop</span>
            </p>
            <p class="text-xs text-gray-500" data-i18n="upload.hints.singlePdf">
              A single PDF file
            </p>
            <p class="text-xs text-gray-500" data-i18n="upload.filesNeverLeave">
              Your files never leave your device.
            </p>
          </div>
          <input
            type="file"
            id="file-input"
            accept=".pdf"
            class="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer"
          />
        </div>

        <!-- File Display Area -->
        <div id="file-display-area" class="mt-4 hidden"></div>

        <!-- Options Section -->
        <div class="mt-6 space-y-4">
          <div>
            <label
              class="block text-sm font-medium text-gray-300 mb-2"
              data-i18n="tools:tableOfContents.titleLabel"
            >
              TOC Title
            </label>
            <input
              type="text"
              id="toc-title"
              class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Table of Contents"
              data-i18n-placeholder="tools:tableOfContents.name"
            />
          </div>

          <div>
            <label
              class="block text-sm font-medium text-gray-300 mb-2"
              data-i18n="tools:tableOfContents.fontSize"
            >
              Font Size
            </label>
            <select
              id="font-size"
              class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option value="10">10pt</option>
              <option value="11">11pt</option>
              <option value="12" selected>12pt</option>
              <option value="14">14pt</option>
              <option value="16">16pt</option>
              <option value="18">18pt</option>
              <option value="20">20pt</option>
              <option value="22">22pt</option>
              <option value="24">24pt</option>
              <option value="26">26pt</option>
              <option value="30">30pt</option>
              <option value="36">36pt</option>
              <option value="42">42pt</option>
              <option value="48">48pt</option>
              <option value="60">60pt</option>
              <option value="72">72pt</option>
            </select>
          </div>

          <div>
            <label
              class="block text-sm font-medium text-gray-300 mb-2"
              data-i18n="tools:tableOfContents.fontFamily"
            >
              Font Family
            </label>
            <select
              id="font-family"
              class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option value="0">Times Roman</option>
              <option value="1">Times Bold</option>
              <option value="2">Times Italic</option>
              <option value="3">Times Bold Italic</option>
              <option value="4" selected>Helvetica</option>
              <option value="5">Helvetica Bold</option>
              <option value="6">Helvetica Oblique</option>
              <option value="7">Helvetica Bold Oblique</option>
              <option value="8">Courier</option>
              <option value="9">Courier Bold</option>
              <option value="10">Courier Oblique</option>
              <option value="11">Courier Bold Oblique</option>
            </select>
          </div>

          <div class="flex items-center gap-2">
            <input
              type="checkbox"
              id="add-bookmark"
              checked
              class="w-4 h-4 accent-blue-500"
            />
            <label
              for="add-bookmark"
              class="text-sm text-gray-300"
              data-i18n="tools:tableOfContents.addBookmark"
            >
              Add bookmark for TOC page
            </label>
          </div>
        </div>

        <!-- Generate Button -->
        <button id="generate-btn" disabled class="btn-gradient w-full mt-6">
          <span
            id="generate-btn-text"
            data-i18n="tools:tableOfContents.generateButton"
            >Generate Table of Contents</span
          >
        </button>

        <!-- Status Message -->
        <div
          id="status-message"
          class="mt-4 hidden p-3 rounded-lg text-sm"
        ></div>
      </div>
    </div>

    <!-- How It Works Section -->

    <!-- Related Tools Section -->

    <!-- FAQ Section -->
    {{> footer }}
    <script type="module" src="/src/js/utils/lucide-init.ts"></script>
    <script type="module" src="/src/js/utils/full-width.ts"></script>
    <script type="module" src="/src/js/utils/simple-mode-footer.ts"></script>
    <script type="module" src="/src/js/logic/table-of-contents.ts"></script>
    <script type="module" src="/src/js/mobileMenu.ts"></script>
    <script type="module" src="/src/js/main.ts"></script>

    <!-- JSON-LD Structured Data -->
  </body>
</html>
